<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTAYKIT IT INV - Property of Ktaykit Fast Food</title>
    <!-- Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <!-- QRCode.js Library -->
    <script src="https://cloudflare.com"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #qrPanel, #qrPanel * { visibility: visible; }
            #qrPanel { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; }
            #btnPrint { display: none; }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-6 transition-all duration-300">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="bg-blue-700 text-white p-5 rounded-t-xl shadow-md flex justify-between items-center">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-wide">KTAYKIT IT INV</h1>
                <p id="headerSubtitle" class="text-xs md:text-sm text-blue-200 font-medium mt-1">Property of Ktaykit Fast Food</p>
            </div>
            
            <!-- Language Switcher -->
            <button id="langSwitcher" class="bg-blue-900 hover:bg-blue-950 text-white font-semibold py-2 px-5 rounded-lg text-sm transition cursor-pointer shadow">
                العربية
            </button>
        </header>

        <!-- Single Item View Modal/Card (Opens when QR is scanned) -->
        <div id="scannedItemView" class="hidden mt-6 bg-white p-6 md:p-8 rounded-xl shadow-lg border-t-4 border-blue-600 max-w-2xl mx-auto">
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <h2 id="scanViewTitle" class="text-xl font-bold text-gray-800">Item Details</h2>
                <button onclick="closeScannedView()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1 rounded text-sm font-medium">Back to Inventory</button>
            </div>
            <div id="scannedItemDetails" class="space-y-3 text-gray-700">
                <!-- Scanned item data loads here -->
            </div>
        </div>

        <!-- Main Content Grid -->
        <div id="mainDashboard" class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">
            
            <!-- Data Entry Form -->
            <div class="bg-white p-6 rounded-xl shadow-md h-fit">
                <h2 id="formTitle" class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Item Entry Form</h2>
                <form id="inventoryForm" class="space-y-4">
                    <div>
                        <label id="lblSrNo" class="block text-sm font-semibold text-gray-700">Sr. No</label>
                        <input type="number" id="srNo" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label id="lblItemCode" class="block text-sm font-semibold text-gray-700">Item Code</label>
                        <input type="text" id="itemCode" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label id="lblItemName" class="block text-sm font-semibold text-gray-700">Item Name</label>
                        <input type="text" id="itemName" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label id="lblDesc" class="block text-sm font-semibold text-gray-700">Description</label>
                        <textarea id="description" rows="2" class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                    </div>
                    <div>
                        <label id="lblDept" class="block text-sm font-semibold text-gray-700">Department</label>
                        <input type="text" id="department" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label id="lblLoc" class="block text-sm font-semibold text-gray-700">Location</label>
                        <input type="text" id="location" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label id="lblStatus" class="block text-sm font-semibold text-gray-700">Status</label>
                        <select id="status" class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                            <option value="Active" id="optActive">Active</option>
                            <option value="Inactive" id="optInactive">Inactive</option>
                            <option value="Maintenance" id="optMaint">Maintenance</option>
                        </select>
                    </div>
                    <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow transition cursor-pointer">Save & Generate QR</button>
                </form>
            </div>

            <!-- Right Side: QR Display & Data Table -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- QR Code Box -->
                <div id="qrPanel" class="bg-white p-6 rounded-xl shadow-md hidden flex flex-col items-center justify-center text-center border border-gray-200">
                    <p class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-1">Property of Ktaykit Fast Food</p>
                    <h3 class="text-lg font-bold text-gray-800 mb-3" id="qrTitle">Generated QR Code</h3>
                    <div id="qrcode" class="p-3 bg-white border-2 border-gray-300 rounded-lg mb-3"></div>
                    <p class="text-xs text-gray-500 mb-4 max-w-md break-all" id="qrLinkText"></p>
                    <button id="btnPrint" onclick="window.print()" class="bg-gray-800 text-white text-sm font-medium px-5 py-2 rounded-lg hover:bg-gray-900 cursor-pointer shadow">Print QR Label</button>
                </div>

                <!-- Data Table -->
                <div class="bg-white p-6 rounded-xl shadow-md overflow-x-auto">
                    <h2 id="tableTitle" class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Stored Inventory Items</h2>
                    <table class="w-full text-start border-collapse text-sm">
                        <thead>
                            <tr class="bg-gray-100 text-gray-700 border-b border-gray-200">
                                <th id="thSr" class="p-3 text-start">Sr. No</th>
                                <th id="thCode" class="p-3 text-start">Code</th>
                                <th id="thName" class="p-3 text-start">Item Name</th>
                                <th id="thDept" class="p-3 text-start">Dept / Location</th>
                                <th id="thStatus" class="p-3 text-start">Status</th>
                                <th id="thAction" class="p-3 text-center">QR Code</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody" class="divide-y divide-gray-200">
                            <tr>
                                <td colspan="6" class="p-4 text-center text-gray-400">Loading data from database...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, addDoc, onSnapshot, doc, getDoc } from "https://gstatic.com";

        // --- আপনার FIREBASE CONFIG এখানে বসান ---
        const firebaseConfig = {
  apiKey: "AIzaSyDtBr3C8SZLim8S-kB6f8aMqGiR404uueU",
  authDomain: "ktaykit-it-inv.firebaseapp.com",
  projectId: "ktaykit-it-inv",
  storageBucket: "ktaykit-it-inv.firebasestorage.app",
  messagingSenderId: "81509943755",
  appId: "1:81509943755:web:689e6c356f85c58e00ce4e",
  measurementId: "G-B4LJ16NZ3S"
};

       

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const inventoryCollection = collection(db, "items");

        const qrContainer = document.getElementById("qrcode");
        let qrcodeInstance = new QRCode(qrContainer, { width: 160, height: 160 });

        const translations = {
            en: {
                dir: "ltr",
                switcher: "العربية",
                subtitle: "Property of Ktaykit Fast Food",
                formTitle: "Item Entry Form",
                lblSrNo: "Sr. No",
                lblItemCode: "Item Code",
                lblItemName: "Item Name",
                lblDesc: "Description",
                lblDept: "Department",
                lblLoc: "Location",
                lblStatus: "Status",
                optActive: "Active",
                optInactive: "Inactive",
                optMaint: "Maintenance",
                btnSubmit: "Save & Generate QR",
                tableTitle: "Stored Inventory Items",
                thSr: "Sr. No",
                thCode: "Code",
                thName: "Item Name",
                thDept: "Dept / Location",
                thStatus: "Status",
                thAction: "QR Code",
                btnAction: "Show QR",
                qrTitle: "QR Code",
btnPrint: "Print QR Label",
alertSuccess: "Data Successfully Saved!",
scanTitle: "Scanned Item Details"
},
ar: {
dir: "rtl",
switcher: "English",
subtitle: "ملك لـ كتيكت للوجبات السريعة",
formTitle: "نموذج إدخال المواد",
lblSrNo: "الرقم التسلسلي",
lblItemCode: "رمز المادة",
lblItemName: "اسم المادة",
lblDesc: "الوصف",
lblDept: "القسم",
lblLoc: "الموقع",
lblStatus: "الحالة",
optActive: "نشط",
optInactive: "غير نشط",
optMaint: "صيانة",
btnSubmit: "حفظ وإنشاء رمز QR",
tableTitle: "المواد المخزنة في المستودع",
thSr: "الرقم",
thCode: "الرمز",
thName: "اسم المادة",
thDept: "القسم / الموقع",
thStatus: "الحالة",
thAction: "رمز QR",
btnAction: "عرض QR",
qrTitle: "رمز QR",
btnPrint: "طباعة ملصق QR",
alertSuccess: "تم حفظ البيانات بنجاح!",
scanTitle: "تفاصيل المادة الممسوحة"
}
};
let currentLang = "en";
let localItemsList = [];
// Language Toggle
document.getElementById("langSwitcher").addEventListener("click", () => {
currentLang = currentLang === "en" ? "ar" : "en";
applyLanguage(currentLang);
});
function applyLanguage(lang) {
const data = translations[lang];
document.documentElement.dir = data.dir;
document.documentElement.lang = lang;
document.getElementById("langSwitcher").innerText = data.switcher;
document.getElementById("headerSubtitle").innerText = data.subtitle;
document.getElementById("formTitle").innerText = data.formTitle;
document.getElementById("lblSrNo").innerText = data.lblSrNo;
document.getElementById("lblItemCode").innerText = data.lblItemCode;
document.getElementById("lblItemName").innerText = data.lblItemName;
document.getElementById("lblDesc").innerText = data.lblDesc;
document.getElementById("lblDept").innerText = data.lblDept;
document.getElementById("lblLoc").innerText = data.lblLoc;
document.getElementById("lblStatus").innerText = data.lblStatus;
document.getElementById("optActive").innerText = data.optActive;
document.getElementById("optInactive").innerText = data.optInactive;
document.getElementById("optMaint").innerText = data.optMaint;
document.getElementById("btnSubmit").innerText = data.btnSubmit;
document.getElementById("tableTitle").innerText = data.tableTitle;
document.getElementById("thSr").innerText = data.thSr;
document.getElementById("thCode").innerText = data.thCode;
document.getElementById("thName").innerText = data.thName;
document.getElementById("thDept").innerText = data.thDept;
document.getElementById("thStatus").innerText = data.thStatus;
document.getElementById("thAction").innerText = data.thAction;
document.getElementById("btnPrint").innerText = data.btnPrint;
document.getElementById("scanViewTitle").innerText = data.scanTitle;
renderTable();
}
// Save Data
document.getElementById("inventoryForm").addEventListener("submit", async (e) => {
e.preventDefault();
const itemData = {
srNo: parseInt(document.getElementById("srNo").value),
itemCode: document.getElementById("itemCode").value,
itemName: document.getElementById("itemName").value,
description: document.getElementById("description").value,
department: document.getElementById("department").value,
location: document.getElementById("location").value,
status: document.getElementById("status").value,
timestamp: new Date()
};
try {
const docRef = await addDoc(inventoryCollection, itemData);
document.getElementById("inventoryForm").reset();
showQRCode(docRef.id, itemData.itemName, itemData.itemCode);
alert(translations[currentLang].alertSuccess);
} catch (error) {
console.error("Error: ", error);
alert("Database Error! Check your Firebase Config & Rules.");
}
});
// Fetch Live Data
onSnapshot(inventoryCollection, (snapshot) => {
localItemsList = [];
snapshot.forEach(doc => localItemsList.push({ id: doc.id, ...doc.data() }));
localItemsList.sort((a, b) => a.srNo - b.srNo);
renderTable();
});
// Render Table
function renderTable() {
const tableBody = document.getElementById("inventoryTableBody");
tableBody.innerHTML = "";
if (localItemsList.length === 0) {
tableBody.innerHTML = <tr><td colspan="6" class="p-4 text-center text-gray-400">No items found. Add your first item!</td></tr>;
return;
}
localItemsList.forEach((item) => {
const row = document.createElement("tr");
row.className = "hover:bg-gray-50 transition";
let statusColor = "bg-green-100 text-green-800";
let statusText = translations[currentLang].optActive;
if (item.status === "Inactive") {
statusColor = "bg-red-100 text-red-800";
statusText = translations[currentLang].optInactive;
} else if (item.status === "Maintenance") {
statusColor = "bg-yellow-100 text-yellow-800";
statusText = translations[currentLang].optMaint;
}
row.innerHTML = `
${item.srNo}
${item.itemCode}
${item.itemName}
\({item.department}<br><span class="text-xs text-gray-400">\){item.location}
${statusText}
`;
tableBody.appendChild(row);
});
document.querySelectorAll(".scan-qr-btn").forEach(button => {
button.addEventListener("click", (e) => {
const docId = e.target.getAttribute("data-id");
const itemName = e.target.getAttribute("data-name");
const itemCode = e.target.getAttribute("data-code");
showQRCode(docId, itemName, itemCode);
});
});
}
// Generate QR Code
function showQRCode(id, name, code) {
const baseURL = window.location.href.split('?')[0];
const scanTargetURL = ${baseURL}?viewItem=${id};
document.getElementById("qrPanel").classList.remove("hidden");
document.getElementById("qrTitle").innerText = ${name} (${code});
document.getElementById("qrLinkText").innerText = scanTargetURL;
qrcodeInstance.clear();
qrcodeInstance.makeCode(scanTargetURL);
}
// Handle QR Scan Page Load
window.addEventListener('DOMContentLoaded', async () => {
const urlParams = new URLSearchParams(window.location.search);
const viewItemId = urlParams.get('viewItem');
if (viewItemId) {
document.getElementById("mainDashboard").classList.add("hidden");
const scanCard = document.getElementById("scannedItemView");
const detailsBox = document.getElementById("scannedItemDetails");
scanCard.classList.remove("hidden");
detailsBox.innerHTML = <p class="text-gray-500">Fetching item details from cloud...</p>;
try {
const docRef = doc(db, "items", viewItemId);
const docSnap = await getDoc(docRef);
if (docSnap.exists()) {
const data = docSnap.data();
detailsBox.innerHTML = <div class="bg-gray-50 p-4 rounded-lg border space-y-2"> <p><strong>Sr. No:</strong> ${data.srNo}</p> <p><strong>Item Code:</strong> <span class="font-mono text-blue-700 font-bold">${data.itemCode}</span></p> <p><strong>Item Name:</strong> ${data.itemName}</p> <p><strong>Description:</strong> ${data.description || 'N/A'}</p> <p><strong>Department:</strong> ${data.department}</p> <p><strong>Location:</strong> ${data.location}</p> <p><strong>Status:</strong> <span class="px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-semibold">${data.status}</span></p> </div>;
} else {
detailsBox.innerHTML = <p class="text-red-500 font-semibold">Item not found in database!</p>;
}
} catch (err) {
detailsBox.innerHTML = <p class="text-red-500">Error loading item details.</p>;
}
}
});
window.closeScannedView = function() {
window.location.href = window.location.href.split('?')[0];
};
