<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTAYKIT IT INV - Property of Ktaykit Fast Food</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #qrPanel, #qrPanel * { visibility: visible; }
            #qrPanel { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; }
            #btnPrint { display: none; }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-6 transition-all duration-300">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="bg-blue-700 text-white p-5 rounded-t-xl shadow-md flex justify-between items-center">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-wide">KTAYKIT IT INV</h1>
                <p id="headerSubtitle" class="text-xs md:text-sm text-blue-200 font-medium mt-1">Property of Ktaykit Fast Food</p>
            </div>
            <!-- Language Switcher -->
            <button id="langSwitcher" class="bg-blue-900 hover:bg-blue-950 text-white font-semibold py-2 px-5 rounded-lg text-sm transition cursor-pointer shadow">
                العربية
            </button>
        </header>

        <!-- Scanned Item View -->
        <div id="scannedItemView" class="hidden mt-6 bg-white p-6 md:p-8 rounded-xl shadow-lg border-t-4 border-blue-600 max-w-2xl mx-auto">
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <h2 id="scanViewTitle" class="text-xl font-bold text-gray-800">Item Details</h2>
                <button onclick="closeScannedView()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1 rounded text-sm font-medium">Back to Inventory</button>
            </div>
            <div id="scannedItemDetails" class="space-y-3 text-gray-700"></div>
        </div>

        <!-- Main Content Grid -->
        <div id="mainDashboard" class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">
            <!-- Data Entry Form -->
            <div class="bg-white p-6 rounded-xl shadow-md h-fit">
                <h2 id="formTitle" class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Item Entry Form</h2>
                <form id="inventoryForm" class="space-y-4">
                    <input type="hidden" id="editingDocId" value="">
                    <div>
                        <label id="lblSrNo" class="block text-sm font-semibold text-gray-700">Sr. No (Auto)</label>
                        <input type="text" id="srNo" readonly class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg bg-gray-100 font-mono text-gray-600 cursor-not-allowed">
                    </div>
                    <div>
                        <label id="lblItemCode" class="block text-sm font-semibold text-gray-700">Item Code (Auto)</label>
                        <input type="text" id="itemCode" readonly class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg bg-gray-100 font-mono text-gray-600 cursor-not-allowed">
                    </div>
                    <div>
                        <label id="lblItemName" class="block text-sm font-semibold text-gray-700">Item Name</label>
                        <input type="text" id="itemName" required placeholder="e.g. Dell Laptop" class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label id="lblDesc" class="block text-sm font-semibold text-gray-700">Description</label>
                        <textarea id="description" rows="2" class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label id="lblPurchaseDate" class="block text-sm font-semibold text-gray-700">Purchase Date</label>
                            <input type="date" id="purchaseDate" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        </div>
                        <div>
                            <label id="lblWarranty" class="block text-sm font-semibold text-gray-700">Warranty Date</label>
                            <input type="date" id="warrantyDate" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        </div>
                    </div>
                    <!-- Department Dropdown with Add More -->
                    <div>
                        <label id="lblDept" class="block text-sm font-semibold text-gray-700">Department</label>
                        <select id="department" class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white mb-2">
                            <option value="IT Support">IT Support</option>
                            <option value="Kitchen">Kitchen</option>
                            <option value="Cashier / POS">Cashier / POS</option>
                            <option value="Management">Management</option>
                            <option value="add_new">+ Add New Department</option>
                        </select>
                        <input type="text" id="newDepartmentInput" placeholder="Enter new department..." class="hidden w-full p-2.5 border border-blue-400 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <!-- Location Dropdown with Add More -->
                    <div>
                        <label id="lblLoc" class="block text-sm font-semibold text-gray-700">Location</label>
                        <select id="location" class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white mb-2">
                            <option value="Branch Main Hall">Branch Main Hall</option>
                            <option value="Server Room">Server Room</option>
                            <option value="Kitchen Counter">Kitchen Counter</option>
                            <option value="Store Room">Store Room</option>
                            <option value="add_new">+ Add New Location</option>
                        </select>
                        <input type="text" id="newLocationInput" placeholder="Enter new location..." class="hidden w-full p-2.5 border border-blue-400 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label id="lblStatus" class="block text-sm font-semibold text-gray-700">Status</label>
                        <select id="status" class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                            <option value="Active" id="optActive">Active</option>
                            <option value="Inactive" id="optInactive">Inactive</option>
                            <option value="Maintenance" id="optMaint">Maintenance</option>
                            <option value="Damage" id="optDamage">Damage</option>
                        </select>
                    </div>
                    <div>
                        <label id="lblRemarks" class="block text-sm font-semibold text-gray-700">Remarks</label>
                        <input type="text" id="remarks" placeholder="Optional notes..." class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" id="btnSubmit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow transition cursor-pointer">Save & Generate QR</button>
                        <button type="button" id="btnCancelEdit" onclick="cancelEditMode()" class="hidden bg-gray-500 hover:bg-gray-600 text-white font-semibold px-4 py-2.5 rounded-lg shadow transition cursor-pointer">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Right Side: QR Display & Data Table -->
            <div class="lg:col-span-2 space-y-6">
                <!-- QR Code Box -->
                <div id="qrPanel" class="bg-white p-6 rounded-xl shadow-md hidden flex flex-col items-center justify-center text-center border border-gray-200">
                    <p class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-1">Property of Ktaykit Fast Food</p>
                    <h3 class="text-lg font-bold text-gray-800 mb-3" id="qrTitle">Generated QR Code</h3>
                    <div id="qrcode" class="p-3 bg-white border-2 border-gray-300 rounded-lg mb-3 inline-block"></div>
                    <p class="text-xs text-gray-500 mb-4 max-w-md break-all" id="qrLinkText"></p>
                    <button id="btnPrint" onclick="window.print()" class="bg-gray-800 text-white text-sm font-medium px-5 py-2 rounded-lg hover:bg-gray-900 cursor-pointer shadow">Print QR Label</button>
                </div>

                <!-- Data Table -->
                <div class="bg-white p-6 rounded-xl shadow-md overflow-x-auto">
                    <h2 id="tableTitle" class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Stored Inventory Items</h2>
                    <table class="w-full text-start border-collapse text-sm">
                        <thead>
                            <tr class="bg-gray-100 text-gray-700 border-b border-gray-200">
                                <th id="thSr" class="p-3 text-start">Sr. No</th>
                                <th id="thCode" class="p-3 text-start">Code</th>
                                <th id="thName" class="p-3 text-start">Item Name</th>
                                <th id="thDates" class="p-3 text-start">Purchase / Warranty</th>
                                <th id="thDept" class="p-3 text-start">Dept / Loc</th>
                                <th id="thStatus" class="p-3 text-start">Status</th>
                                <th id="thRemarks" class="p-3 text-start">Remarks</th>
                                <th id="thAction" class="p-3 text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody">
                            <tr>
                                <td colspan="8" class="p-4 text-center text-gray-400">Loading data from database...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Version 10 Stable) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- আপনার Firebase Config এখানে বসান ---
        const firebaseConfig = {
            apiKey: "AIzaSyADezVnAvMNfKi5QnMJ-uBUHBKpckXRtV0",
            authDomain: "kty-inv.firebaseapp.com",
            projectId: "kty-inv",
            storageBucket: "kty-inv.firebasestorage.app",
            messagingSenderId: "1071673400086",
            appId: "1:1071673400086:web:4e4e1c34848e72f2b24e37"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const inventoryCollection = collection(db, "items");

        const qrContainer = document.getElementById("qrcode");
        let qrcodeInstance = new QRCode(qrContainer, { width: 160, height: 160 });

        const translations = {
            en: {
                dir: "ltr", switcher: "العربية", subtitle: "Property of Ktaykit Fast Food",
                formTitle: "Item Entry Form", lblSrNo: "Sr. No (Auto)", lblItemCode: "Item Code (Auto)",
                lblItemName: "Item Name", lblDesc: "Description", lblPurchaseDate: "Purchase Date",
                lblWarranty: "Warranty Date", lblDept: "Department", lblLoc: "Location", lblStatus: "Status",
                lblRemarks: "Remarks", optActive: "Active", optInactive: "Inactive", optMaint: "Maintenance", optDamage: "Damage",
                btnSubmit: "Save & Generate QR", btnUpdate: "Update Item", tableTitle: "Stored Inventory Items", thSr: "Sr. No",
                thCode: "Code", thName: "Item Name", thDates: "Purchase / Warranty", thDept: "Dept / Loc",
                thStatus: "Status", thRemarks: "Remarks", thAction: "Actions", btnAction: "QR", btnEdit: "Edit", btnDel: "Delete",
                qrTitle: "QR Code", btnPrint: "Print QR Label", alertSuccess: "Data Successfully Saved!", alertUpdate: "Data Successfully Updated!", scanTitle: "Scanned Item Details"
            },
            ar: {
                dir: "rtl", switcher: "English", subtitle: "ملك لـ كتيكت للوجبات السريعة",
                formTitle: "نموذج إدخال المواد", lblSrNo: "الرقم التسلسلي (تلقائي)", lblItemCode: "رمز المادة (تلقائي)",
                lblItemName: "اسم المادة", lblDesc: "الوصف", lblPurchaseDate: "تاريخ الشراء",
                lblWarranty: "تاريخ الضمان", lblDept: "القسم", lblLoc: "الموقع", lblStatus: "الحالة",
                lblRemarks: "الملاحظات", optActive: "نشط", optInactive: "غير نشط", optMaint: "صيانة", optDamage: "تالف",
                btnSubmit: "حفظ وإنشاء رمز QR", btnUpdate: "تحديث المادة", tableTitle: "المواد المخزنة في المستودع", thSr: "الرقم",
                thCode: "الرمز", thName: "اسم المادة", thDates: "الشراء / الضمان", thDept: "القسم / الموقع",
                thStatus: "الحالة", thRemarks: "الملاحظات", thAction: "الإجراءات", btnAction: "QR", btnEdit: "تعديل", btnDel: "حذف",
                qrTitle: "رمز QR", printBtn: "طباعة ملصق QR", alertSuccess: "تم حفظ البيانات بنجاح!", alertUpdate: "تم تحديث البيانات بنجاح!", scanTitle: "تفاصيل المادة الممسوحة"
            }
        };

        let currentLang = "en";
        let localItemsList = [];

        document.getElementById("langSwitcher").addEventListener("click", () => {
            currentLang = currentLang === "en" ? "ar" : "en";
            applyLanguage(currentLang);
        });

        function applyLanguage(lang) {
            const data = translations[lang];
            document.documentElement.dir = data.dir;
            document.documentElement.lang = lang;
            document.getElementById("langSwitcher").innerText = data.switcher;
            document.getElementById("headerSubtitle").innerText = data.subtitle;
            document.getElementById("formTitle").innerText = data.formTitle;
            document.getElementById("lblSrNo").innerText = data.lblSrNo;
            document.getElementById("lblItemCode").innerText = data.lblItemCode;
            document.getElementById("lblItemName").innerText = data.lblItemName;
            document.getElementById("lblDesc").innerText = data.lblDesc;
            document.getElementById("lblPurchaseDate").innerText = data.lblPurchaseDate;
            document.getElementById("lblWarranty").innerText = data.lblWarranty;
            document.getElementById("lblDept").innerText = data.lblDept;
            document.getElementById("lblLoc").innerText = data.lblLoc;
            document.getElementById("lblStatus").innerText = data.lblStatus;
            document.getElementById("lblRemarks").innerText = data.lblRemarks;
            document.getElementById("optActive").innerText = data.optActive;
            document.getElementById("optInactive").innerText = data.optInactive;
            document.getElementById("optMaint").innerText = data.optMaint;
            document.getElementById("optDamage").innerText = data.optDamage;
            
            const isEditing = document.getElementById("editingDocId").value !== "";
            document.getElementById("btnSubmit").innerText = isEditing ? data.btnUpdate : data.btnSubmit;
            
            document.getElementById("tableTitle").innerText = data.tableTitle;
            document.getElementById("thSr").innerText = data.thSr;
            document.getElementById("thCode").innerText = data.thCode;
            document.getElementById("thName").innerText = data.thName;
            document.getElementById("thDates").innerText = data.thDates;
            document.getElementById("thDept").innerText = data.thDept;
            document.getElementById("thStatus").innerText = data.thStatus;
            document.getElementById("thRemarks").innerText = data.thRemarks;
            document.getElementById("thAction").innerText = data.thAction;
            document.getElementById("btnPrint").innerText = data.btnPrint;
            document.getElementById("scanViewTitle").innerText = data.scanTitle;
            renderTable();
        }

        // Handle Dynamic "Add New" Dropdowns
        document.getElementById("department").addEventListener("change", (e) => {
            const input = document.getElementById("newDepartmentInput");
            if (e.target.value === "add_new") {
                input.classList.remove("hidden");
                input.required = true;
                input.focus();
            } else {
                input.classList.add("hidden");
                input.required = false;
                input.value = "";
            }
        });

        document.getElementById("location").addEventListener("change", (e) => {
            const input = document.getElementById("newLocationInput");
            if (e.target.value === "add_new") {
                input.classList.remove("hidden");
                input.required = true;
                input.focus();
            } else {
                input.classList.add("hidden");
                input.required = false;
                input.value = "";
            }
        });

        function generateAutoValues() {
            if (document.getElementById("editingDocId").value !== "") return; // Don't change code during edit
            let nextNum = 1;
            if (localItemsList.length > 0) {
                const maxSr = Math.max(...localItemsList.map(item => parseInt(item.srNo) || 0));
                nextNum = maxSr + 1;
            }
            document.getElementById("srNo").value = String(nextNum).padStart(4, '0');
            document.getElementById("itemCode").value = 'KT-' + Math.floor(1000 + Math.random() * 9000);
        }

        document.getElementById("inventoryForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const editId = document.getElementById("editingDocId").value;
            
            // Get Department Value
            let dept = document.getElementById("department").value;
            if (dept === "add_new") {
                dept = document.getElementById("newDepartmentInput").value.trim();
                // Add to dropdown dynamically
                const select = document.getElementById("department");
                const opt = document.createElement("option");
                opt.value = dept;
                opt.innerText = dept;
                select.insertBefore(opt, select.lastElementChild);
                select.value = dept;
                document.getElementById("newDepartmentInput").classList.add("hidden");
            }

            // Get Location Value
            let loc = document.getElementById("location").value;
            if (loc === "add_new") {
                loc = document.getElementById("newLocationInput").value.trim();
                const select = document.getElementById("location");
                const opt = document.createElement("option");
                opt.value = loc;
                opt.innerText = loc;
                select.insertBefore(opt, select.lastElementChild);
                select.value = loc;
                document.getElementById("newLocationInput").classList.add("hidden");
            }

            const itemData = {
                srNo: document.getElementById("srNo").value,
                itemCode: document.getElementById("itemCode").value,
                itemName: document.getElementById("itemName").value,
                description: document.getElementById("description").value,
                purchaseDate: document.getElementById("purchaseDate").value,
                warrantyDate: document.getElementById("warrantyDate").value,
                department: dept,
                location: loc,
                status: document.getElementById("status").value,
                remarks: document.getElementById("remarks").value || '-',
                timestamp: new Date()
            };

            try {
                if (editId) {
                    // Update existing item
                    const docRef = doc(db, "items", editId);
                    await updateDoc(docRef, itemData);
                    alert(translations[currentLang].alertUpdate);
                    cancelEditMode();
                } else {
                    // Add new item
                    const docRef = await addDoc(inventoryCollection, itemData);
                    showQRCode(docRef.id, itemData.itemName, itemData.itemCode);
                    alert(translations[currentLang].alertSuccess);
                }
                document.getElementById("inventoryForm").reset();
                generateAutoValues();
            } catch (error) {
                console.error("Error: ", error);
                alert("Database Error! Check your Firebase Rules & Config.");
            }
        });

        onSnapshot(inventoryCollection, (snapshot) => {
            localItemsList = [];
            snapshot.forEach(doc => localItemsList.push({ id: doc.id, ...doc.data() }));
            localItemsList.sort((a, b) => parseInt(a.srNo) - parseInt(b.srNo));
            if (!document.getElementById("editingDocId").value) {
                generateAutoValues();
            }
            renderTable();
        }, (error) => {
            console.error("Firestore Error:", error);
            document.getElementById("inventoryTableBody").innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-500">Database Connection Error: ${error.message}</td></tr>`;
        });

        function renderTable() {
            const tableBody = document.getElementById("inventoryTableBody");
            tableBody.innerHTML = "";
            if (localItemsList.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-gray-400">No items found. Add your first item!</td></tr>`;
                return;
            }
            localItemsList.forEach((item) => {
                const row = document.createElement("tr");
                row.className = "hover:bg-gray-50 transition border-b border-gray-100";
                let statusColor = "bg-green-100 text-green-800";
                let statusText = translations[currentLang].optActive;
                if (item.status === "Inactive") {
                    statusColor = "bg-red-100 text-red-800";
                    statusText = translations[currentLang].optInactive;
                } else if (item.status === "Maintenance") {
                    statusColor = "bg-yellow-100 text-yellow-800";
                    statusText = translations[currentLang].optMaint;
                } else if (item.status === "Damage") {
                    statusColor = "bg-rose-100 text-rose-900 font-bold";
                    statusText = translations[currentLang].optDamage;
                }

                row.innerHTML = `
                    <td class="p-3 font-mono font-medium text-gray-700">${item.srNo}</td>
                    <td class="p-3 font-mono text-blue-600 font-semibold">${item.itemCode}</td>
                    <td class="p-3 font-semibold text-gray-900">${item.itemName}</td>
                    <td class="p-3 text-xs text-gray-600">P: ${item.purchaseDate || 'N/A'}<br>W: ${item.warrantyDate || 'N/A'}</td>
                    <td class="p-3 text-gray-500">${item.department} <br> <span class="text-xs text-gray-400">${item.location}</span></td>
                    <td class="p-3"><span class="px-2.5 py-1 text-xs rounded-full font-medium ${statusColor}">${statusText}</span></td>
                    <td class="p-3 text-gray-600 text-xs">${item.remarks}</td>
                    <td class="p-3 text-center space-x-1 whitespace-nowrap">
                        <button class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-2.5 py-1 rounded shadow cursor-pointer scan-qr-btn" data-id="${item.id}" data-name="${item.itemName}" data-code="${item.itemCode}">
                            ${translations[currentLang].btnAction}
                        </button>
                        <button class="bg-amber-500 hover:bg-amber-600 text-white text-xs px-2.5 py-1 rounded shadow cursor-pointer edit-btn" data-id="${item.id}">
                            ${translations[currentLang].btnEdit}
                        </button>
                        <button class="bg-red-600 hover:bg-red-700 text-white text-xs px-2.5 py-1 rounded shadow cursor-pointer delete-btn" data-id="${item.id}">
                            ${translations[currentLang].btnDel}
                        </button>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            // Event Listeners for Row Actions
            document.querySelectorAll(".scan-qr-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    showQRCode(e.target.getAttribute("data-id"), e.target.getAttribute("data-name"), e.target.getAttribute("data-code"));
                });
            });

            document.querySelectorAll(".edit-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    loadItemForEdit(e.target.getAttribute("data-id"));
                });
            });

            document.querySelectorAll(".delete-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    deleteItem(e.target.getAttribute("data-id"));
                });
            });
        }

        async function loadItemForEdit(id) {
            const item = localItemsList.find(i => i.id === id);
            if (!item) return;

            document.getElementById("editingDocId").value = item.id;
            document.getElementById("srNo").value = item.srNo;
            document.getElementById("itemCode").value = item.itemCode;
            document.getElementById("itemName").value = item.itemName;
            document.getElementById("description").value = item.description || "";
            document.getElementById("purchaseDate").value = item.purchaseDate || "";
            document.getElementById("warrantyDate").value = item.warrantyDate || "";
            document.getElementById("department").value = item.department;
            document.getElementById("location").value = item.location;
            document.getElementById("status").value = item.status;
            document.getElementById("remarks").value = item.remarks === '-' ? '' : item.remarks;

            document.getElementById("btnSubmit").innerText = translations[currentLang].btnUpdate;
            document.getElementById("btnCancelEdit").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.cancelEditMode = function() {
            document.getElementById("editingDocId").value = "";
            document.getElementById("inventoryForm").reset();
            document.getElementById("btnSubmit").innerText = translations[currentLang].btnSubmit;
            document.getElementById("btnCancelEdit").classList.add("hidden");
            generateAutoValues();
        }

        async function deleteItem(id) {
            if (confirm("Are you sure you want to delete this item?")) {
                try {
                    await deleteDoc(doc(db, "items", id));
                    alert("Item successfully deleted!");
                } catch (err) {
                    console.error("Delete error:", err);
                    alert("Failed to delete item.");
                }
            }
        }

        function showQRCode(id, name, code) {
            const baseURL = window.location.href.split('?')[0];
            const scanTargetURL = `${baseURL}?viewItem=${id}`;
            document.getElementById("qrPanel").classList.remove("hidden");
            document.getElementById("qrTitle").innerText = `${name} (${code})`;
            document.getElementById("qrLinkText").innerText = scanTargetURL;
            qrcodeInstance.clear();
            qrcodeInstance.makeCode(scanTargetURL);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const viewItemId = urlParams.get('viewItem');
            if (viewItemId) {
                document.getElementById("mainDashboard").classList.add("hidden");
                const scanCard = document.getElementById("scannedItemView");
                const detailsBox = document.getElementById("scannedItemDetails");
                scanCard.classList.remove("hidden");
                detailsBox.innerHTML = `<p class="text-gray-500">Fetching item details from cloud...</p>`;
                try {
                    const docRef = doc(db, "items", viewItemId);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        detailsBox.innerHTML = `
                            <div class="bg-gray-50 p-4 rounded-xl border space-y-2">
                                <p><strong>Sr. No:</strong> ${data.srNo}</p>
                                <p><strong>Item Code:</strong> <span class="font-mono text-blue-700 font-bold">${data.itemCode}</span></p>
                                <p><strong>Item Name:</strong> ${data.itemName}</p>
                                <p><strong>Description:</strong> ${data.description || 'N/A'}</p>
                                <p><strong>Purchase Date:</strong> ${data.purchaseDate || 'N/A'}</p>
                                <p><strong>Warranty Date:</strong> ${data.warrantyDate || 'N/A'}</p>
                                <p><strong>Department:</strong> ${data.department}</p>
                                <p><strong>Location:</strong> ${data.location}</p>
                                <p><strong>Status:</strong> <span class="px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-800 font-semibold text-xs">${data.status}</span></p>
                                <p><strong>Remarks:</strong> ${data.remarks || 'N/A'}</p>
                            </div>
                        `;
                    } else {
                        detailsBox.innerHTML = `<p class="text-red-500 font-semibold">Item not found in database!</p>`;
                    }
                } catch (err) {
                    detailsBox.innerHTML = `<p class="text-red-500">Error loading item details.</p>`;
                }
            }
        });

        window.closeScannedView = function() {
            window.location.href = window.location.href.split('?')[0];
        };
    </script>
</body>
</html>
