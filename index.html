<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTAYKIT IT INV - Property of Ktaykit Fast Food</title>
    <script src="https://cloudflare.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f3f4f6; color: #1f2937; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        header { background-color: #1d4ed8; color: white; padding: 20px 25px; border-radius: 10px 10px 0 0; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        header h1 { font-size: 24px; letter-spacing: 0.5px; }
        header p { font-size: 13px; color: #bfdbfe; margin-top: 4px; }
        .lang-btn { background-color: #1e3a8a; color: white; border: none; padding: 8px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .lang-btn:hover { background-color: #172554; }

        .main-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; margin-top: 24px; }
        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

        .card { background: white; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { font-size: 18px; color: #111827; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 18px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.2); }
        .submit-btn { width: 100%; background-color: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .submit-btn:hover { background-color: #1d4ed8; }

        .qr-panel { text-align: center; margin-bottom: 24px; border: 2px dashed #93c5fd; background-color: #eff6ff; display: none; }
        .qr-panel.active { display: block; }
        #qrcode { display: inline-block; padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 8px; margin: 12px 0; }
        .print-btn { background-color: #1f2937; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 8px; }

        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: start; }
        th { background-color: #f9fafb; color: #374151; font-weight: 600; padding: 12px; border-bottom: 2px solid #e5e7eb; }
        td { padding: 12px; border-bottom: 1px solid #e5e7eb; color: #4b5563; }
        tr:hover { background-color: #f9fafb; }
        
        .badge { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-active { background-color: #dcfce7; color: #166534; }
        .badge-inactive { background-color: #fee2e2; color: #991b1b; }
        .badge-maint { background-color: #fef3c7; color: #92400e; }
        .qr-btn { background-color: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .qr-btn:hover { background-color: #2563eb; }

        .scan-view { max-width: 600px; margin: 24px auto; border-top: 5px solid #2563eb; display: none; }
        .scan-view.active { display: block; }
        .scan-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 12px; margin-bottom: 16px; }
        .back-btn { background-color: #e5e7eb; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: 600; }
        .detail-row { padding: 8px 0; border-bottom: 1px solid #f3f4f6; font-size: 15px; }

        @media print {
            body * { visibility: hidden; }
            #qrPanel, #qrPanel * { visibility: visible; }
            #qrPanel { position: absolute; left: 0; top: 0; width: 100%; border: none; background: white; }
            #btnPrint { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>KTAYKIT IT INV</h1>
            <p id="headerSubtitle">Property of Ktaykit Fast Food</p>
        </div>
        <button id="langSwitcher" class="lang-btn">العربية</button>
    </header>

    <div id="scannedItemView" class="card scan-view">
        <div class="scan-header">
            <h2 id="scanViewTitle" style="border:none; margin:0; padding:0;">Scanned Item Details</h2>
            <button onclick="closeScannedView()" class="back-btn">Back to Inventory</button>
        </div>
        <div id="scannedItemDetails"></div>
    </div>

    <div id="mainDashboard" class="main-grid">
        <div class="card">
            <h2 id="formTitle">Item Entry Form</h2>
            <form id="inventoryForm">
                <div class="form-group">
                    <label id="lblSrNo">Sr. No</label>
                    <input type="number" id="srNo" min="1" required>
                </div>
                <div class="form-group">
                    <label id="lblItemCode">Item Code</label>
                    <input type="text" id="itemCode" required>
                </div>
                <div class="form-group">
                    <label id="lblItemName">Item Name</label>
                    <input type="text" id="itemName" required>
                </div>
                <div class="form-group">
                    <label id="lblDesc">Description</label>
                    <textarea id="description" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label id="lblDept">Department</label>
                    <input type="text" id="department" required>
                </div>
                <div class="form-group">
                    <label id="lblLoc">Location</label>
                    <input type="text" id="location" required>
                </div>
                <div class="form-group">
                    <label id="lblStatus">Status</label>
                    <select id="status">
                        <option value="Active" id="optActive">Active</option>
                        <option value="Inactive" id="optInactive">Inactive</option>
                        <option value="Maintenance" id="optMaint">Maintenance</option>
                    </select>
                </div>
                <button type="submit" id="btnSubmit" class="submit-btn">Save & Generate QR</button>
            </form>
        </div>

        <div>
            <div id="qrPanel" class="card qr-panel">
                <p style="font-size: 11px; font-weight: bold; color: #1d4ed8; text-transform: uppercase;">Property of Ktaykit Fast Food</p>
                <h3 id="qrTitle" style="margin-top: 4px; color: #111827;">Generated QR Code</h3>
                <div id="qrcode"></div>
                <p id="qrLinkText" style="font-size: 11px; color: #6b7280; word-break: break-all;"></p>
                <button id="btnPrint" onclick="window.print()" class="print-btn">Print QR Label</button>
            </div>

            <div class="card">
                <h2 id="tableTitle">Stored Inventory Items</h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th id="thSr">Sr. No</th>
                                <th id="thCode">Code</th>
                                <th id="thName">Item Name</th>
                                <th id="thDept">Dept / Location</th>
                                <th id="thStatus">Status</th>
                                <th id="thAction" style="text-align: center;">QR Code</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody">
                            <tr>
                                <td colspan="6" style="text-align: center; color: #9ca3af;">Loading data from database...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, collection, addDoc, onSnapshot, doc, getDoc } from "https://gstatic.com";

    // --- PASTE YOUR FIREBASE CONFIG BELOW ---
    const firebaseConfig = {
        apiKey: "AIzaSyADezVnAvMNfKi5QnMJ-uBUHBKpckXRtV0",
  authDomain: "kty-inv.firebaseapp.com",
  projectId: "kty-inv",
  storageBucket: "kty-inv.firebasestorage.app",
  messagingSenderId: "1071673400086",
  appId: "1:1071673400086:web:4e4e1c34848e72f2b24e37",
  measurementId: "G-GEK63YYQ0T"

    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const inventoryCollection = collection(db, "items");

    const qrContainer = document.getElementById("qrcode");
    let qrcodeInstance = new QRCode(qrContainer, { width: 150, height: 150 });

    const translations = {
        en: {
            dir: "ltr", switcher: "العربية", subtitle: "Property of Ktaykit Fast Food",
            formTitle: "Item Entry Form", lblSrNo: "Sr. No", lblItemCode: "Item Code",
            lblItemName: "Item Name", lblDesc: "Description", lblDept: "Department",
Use code with caution.
lblLoc: "Location", lblStatus: "Status", optActive: "Active",
optInactive: "Inactive", optMaint: "Maintenance", btnSubmit: "Save & Generate QR",
tableTitle: "Stored Inventory Items", thSr: "Sr. No", thCode: "Code",
thName: "Item Name", thDept: "Dept / Location", thStatus: "Status",
thAction: "QR Code", btnAction: "Show QR", btnPrint: "Print QR Label",
alertSuccess: "Data Successfully Saved!", scanTitle: "Scanned Item Details"
},
ar: {
dir: "rtl", switcher: "English", subtitle: "ملك لـ كتيكت للوجبات السريعة",
formTitle: "نموذج إدخال المواد", lblSrNo: "الرقم التسلسلي", lblItemCode: "رمز المادة",
lblItemName: "اسم المادة", lblDesc: "الوصف", lblDept: "القسم",
lblLoc: "الموقع", lblStatus: "الحالة", optActive: "نشط",
optInactive: "غير نشط", optMaint: "صيانة", btnSubmit: "حفظ وإنشاء رمز QR",
tableTitle: "المواد المخزنة في المستودع", thSr: "الرقم", thCode: "الرمز",
thName: "اسم المادة", thDept: "القسم / الموقع", thStatus: "الحالة",
thAction: "رمز QR", btnAction: "عرض QR", btnPrint: "طباعة ملصق QR",
alertSuccess: "تم حفظ البيانات بنجاح!", scanTitle: "تفاصيل المادة الممسوحة"
}
};
let currentLang = "en";
let localItemsList = new Array();
document.getElementById("langSwitcher").addEventListener("click", () => {
currentLang = currentLang === "en" ? "ar" : "en";
applyLanguage(currentLang);
});
function applyLanguage(lang) {
const data = translations.lang || (lang === "en" ? translations.en : translations.ar);
document.documentElement.dir = data.dir;
document.documentElement.lang = lang;
document.getElementById("langSwitcher").innerText = data.switcher;
document.getElementById("headerSubtitle").innerText = data.subtitle;
document.getElementById("formTitle").innerText = data.formTitle;
document.getElementById("lblSrNo").innerText = data.lblSrNo;
document.getElementById("lblItemCode").innerText = data.lblItemCode;
document.getElementById("lblItemName").innerText = data.lblItemName;
document.getElementById("lblDesc").innerText = data.lblDesc;
document.getElementById("lblDept").innerText = data.lblDept;
document.getElementById("lblLoc").innerText = data.lblLoc;
document.getElementById("lblStatus").innerText = data.lblStatus;
document.getElementById("optActive").innerText = data.optActive;
document.getElementById("optInactive").innerText = data.optInactive;
document.getElementById("optMaint").innerText = data.optMaint;
document.getElementById("btnSubmit").innerText = data.btnSubmit;
document.getElementById("tableTitle").innerText = data.tableTitle;
document.getElementById("thSr").innerText = data.thSr;
document.getElementById("thCode").innerText = data.thCode;
document.getElementById("thName").innerText = data.thName;
document.getElementById("thDept").innerText = data.thDept;
document.getElementById("thStatus").innerText = data.thStatus;
document.getElementById("thAction").innerText = data.thAction;
document.getElementById("btnPrint").innerText = data.btnPrint;
document.getElementById("scanViewTitle").innerText = data.scanTitle;
renderTable();
}
document.getElementById("inventoryForm").addEventListener("submit", async (e) => {
e.preventDefault();
const t = currentLang === "en" ? translations.en : translations.ar;
const itemData = {
srNo: parseInt(document.getElementById("srNo").value),
itemCode: document.getElementById("itemCode").value,
itemName: document.getElementById("itemName").value,
description: document.getElementById("description").value,
department: document.getElementById("department").value,
location: document.getElementById("location").value,
status: document.getElementById("status").value,
timestamp: new Date()
};
try {
const docRef = await addDoc(inventoryCollection, itemData);
document.getElementById("inventoryForm").reset();
showQRCode(docRef.id, itemData.itemName, itemData.itemCode);
alert(t.alertSuccess);
} catch (error) {
console.error("Error: ", error);
alert("Database Error: " + error.message);
}
});
onSnapshot(inventoryCollection, (snapshot) => {
localItemsList = new Array();
snapshot.forEach(doc => localItemsList.push({ id: doc.id, ...doc.data() }));
localItemsList.sort((a, b) => a.srNo - b.srNo);
renderTable();
}, (error) => {
console.error("Firestore Error:", error);
document.getElementById("inventoryTableBody").innerHTML = <tr><td colspan="6" style="text-align:center; color:red;">Error: ${error.message}</td></tr>;
});
function renderTable() {
const tableBody = document.getElementById("inventoryTableBody");
const t = currentLang === "en" ? translations.en : translations.ar;
tableBody.innerHTML = "";
if (localItemsList.length === 0) {
tableBody.innerHTML = <tr><td colspan="6" style="text-align:center; color:#9ca3af;">No items found. Add your first item!</td></tr>;
return;
}
localItemsList.forEach((item) => {
const row = document.createElement("tr");
let badgeClass = "badge-active";
let statusText = t.optActive;
if (item.status === "Inactive") {
badgeClass = "badge-inactive";
statusText = t.optInactive;
} else if (item.status === "Maintenance") {
badgeClass = "badge-maint";
statusText = t.optMaint;
}
row.innerHTML = `
${item.srNo}
${item.itemCode}
${item.itemName}
\({item.department}<br><span style="font-size:12px; color:#9ca3af;">\){item.location}
${statusText}
`;
tableBody.appendChild(row);
});
document.querySelectorAll(".qr-btn").forEach(btn => {
btn.addEventListener("click", (e) => {
showQRCode(
e.target.getAttribute("data-id"),
e.target.getAttribute("data-name"),
e.target.getAttribute("data-code")
);
});
});
}
function showQRCode(id, name, code) {
const urlObj = new URL(window.location.href);
const baseURL = urlObj.origin + urlObj.pathname;
const scanTargetURL = ${baseURL}?viewItem=${id};
document.getElementById("qrPanel").classList.add("active");
document.getElementById("qrTitle").innerText = ${name} (${code});
document.getElementById("qrLinkText").innerText = scanTargetURL;
qrcodeInstance.clear();
qrcodeInstance.makeCode(scanTargetURL);
}
window.addEventListener('DOMContentLoaded', async () => {
const urlParams = new URLSearchParams(window.location.search);
const viewItemId = urlParams.get('viewItem');
if (viewItemId) {
document.getElementById("mainDashboard").style.display = "none";
const scanCard = document.getElementById("scannedItemView");
const detailsBox = document.getElementById("scannedItemDetails");
scanCard.classList.add("active");
detailsBox.innerHTML = <p style="color:#6b7280;">Fetching item details from cloud...</p>;
try {
const docRef = doc(db, "items", viewItemId);
const docSnap = await getDoc(docRef);
if (docSnap.exists()) {
const data = docSnap.data();
detailsBox.innerHTML = <div class="detail-row"><strong>Sr. No:</strong> ${data.srNo}</div> <div class="detail-row"><strong>Item Code:</strong> <span style="font-family:monospace; color:#1d4ed8; font-weight:bold;">${data.itemCode}</span></div> <div class="detail-row"><strong>Item Name:</strong> ${data.itemName}</div> <div class="detail-row"><strong>Description:</strong> ${data.description || 'N/A'}</div> <div class="detail-row"><strong>Department:</strong> ${data.department}</div> <div class="detail-row"><strong>Location:</strong> ${data.location}</div> <div class="detail-row" style="border:none;"><strong>Status:</strong> <span class="badge badge-active">${data.status}</span></div>;
} else {
detailsBox.innerHTML = <p style="color:red; font-weight:bold;">Item not found in database!</p>;
}
} catch (err) {
detailsBox.innerHTML = <p style="color:red;">Error: ${err.message}</p>;
}
}
});
window.closeScannedView = function() {
const urlObj = new URL(window.location.href);
window.location.href = urlObj.origin + urlObj.pathname;
};
